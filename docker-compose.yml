version: "3.8"
services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
  webhook:
    build: .
    command: uvicorn worker_service.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    environment:
      - REDIS_HOST=redis
    depends_on:
      - redis
  worker:
    build: .
    command: rq worker recoveries --url redis://redis:6379
    environment:
      - REDIS_HOST=redis
    depends_on:
      - redis
